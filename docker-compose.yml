# Local development infrastructure: PostgreSQL + pgAdmin.
#   docker compose up -d
# PostgreSQL: localhost:5432 (user/password/db: volleylab)
# pgAdmin:    http://localhost:5050 (login: admin@volleylab.local / admin)
services:
  db:
    image: postgres:16
    container_name: volleylab-db
    environment:
      POSTGRES_USER: volleylab
      POSTGRES_PASSWORD: volleylab
      POSTGRES_DB: volleylab
    ports:
      - "5432:5432"
    volumes:
      - volleylab-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U volleylab -d volleylab"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: volleylab-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@volleylab.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - volleylab-pgadmin:/var/lib/pgadmin

volumes:
  volleylab-pgdata:
  volleylab-pgadmin:
